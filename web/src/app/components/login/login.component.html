<div class="container">
    <div class="main-login">
        <div class="left-login">

            <h1>FEAK</h1>
            <img src="../../../assets/imgs/doctors-animate.svg" alt="Logo FEAK">
        </div>
        <form [formGroup]="formLogin">
        <div class="right-login">
          
                <div class="card-login">
                    <h1>LOGIN</h1>
                    <div class="textfield">
                        <label for="usuario">Usuario</label>
                        <input type="text" name="login" formControlName="login" placeholder="usuario">
                    </div>
                         <div class="textfield">
                        <label for="senha">Senha</label>
                        <input type="password" name="senha" formControlName="senha" placeholder="senha">
                    </div>
                    <button class="btn-login"  (click)="onSubmit()">Login</button>
                </div>
        </div>
        </form>
    </div>
</div>
