<p-toast />
<div class="card" style="padding: 24px;">
    <p-table #dt1 [value]="listaUsuarios"  [scrollable]="true"  [globalFilterFields]="['nomeCompleto', 'nomeLogin', 'ativo']"
        selectionMode="single"   scrollHeight="calc(100vh - 220px)"  [tableStyle]="{ 'min-width': '50rem' }" [rows]="10"
        [showCurrentPageReport]="true"
        [currentPageReportTemplate]="'Exibindo {first} a {last} de {totalRecords} registros'" [paginator]="true">
        <ng-template pTemplate="caption">
            <div style="display: flex; justify-content: space-between;">


                <p-iconField iconPosition="left">
                    <p-inputIcon>
                        <i class="pi pi-search"></i>
                    </p-inputIcon>
                    <input pInputText type="text" (input)="onFilterGlobal($event)" placeholder="Search" />
                </p-iconField>

                <div class="pr-3">
                    <p-button (onClick)="acaoUsuario()" severity="success" label="Novo cadastro" icon="pi pi-plus" />
                </div>

            </div>
        </ng-template>
        <ng-template pTemplate="header">
            <tr>
                <th pSortableColumn="nomeCompleto" style="width:25%">
                    Nome Completo <p-sortIcon field="nomeCompleto" />
                </th>
                <th pSortableColumn="nomeLogin" style="width:25%">
                    Nome Login <p-sortIcon field="nomeLogin" />
                </th>
                <th pSortableColumn="ativo" style="width:25%">
                    Status <p-sortIcon field="ativo" />
                </th>
                <th style="width: 25%;"></th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-user>
            <tr [pSelectableRow]="user">
                <td>
                    {{ user.nomeCompleto }}
                </td>
                <td>
                    {{ user.nomeLogin }}
                </td>
                <td>
                    {{ user.ativo ? 'ativo' : 'inativo' }}
                </td>
                <td style="display: flex;
                            align-items: flex-end;
                            gap: 15px;
                            justify-content: center;">
                    <p-button icon="pi pi-pencil" class="mr-2" (onClick)="acaoUsuario(user)" [rounded]="true"
                        [outlined]="true" severity="success" />
                    <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true"(onClick)="inforUsuario(user)" />
                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="4">Registros não encontratos.</td>
            </tr>
        </ng-template>
    </p-table>

    <div class="card flex justify-content-center">
    <!-- <p-paginator 
        [first]="2" 
        [rows]="10" 
        [totalRecords]="10" 
        [rowsPerPageOptions]="[10, 20, 30]" /> -->
</div>
</div>

<div class="card flex justify-content-center">
    <p-dialog [header]="labelModel" [modal]="true" [closable]="true" [(visible)]="visivel" [style]="{ width: '35vw' }">
        <form [formGroup]="formUsuario">
            <div>
                <div class="flex flex-column gap-3 mb-3">
                    <label for="nomeCompleto" class="font-semibold w-9rem">Nome Completo</label>
                    <input pInputText id="nomeCompleto" formControlName="nomeCompleto" class="flex-auto"
                        autocomplete="off" />
                </div>
                <div class="flex flex-column gap-3 mb-5">
                    <label for="nomeLogin" class="font-semibold w-6rem">Nome Login</label>
                    <input pInputText id="nomeLogin" formControlName="nomeLogin" class="flex-auto" autocomplete="off" />
                </div>

                <div *ngIf="labelModel == 'Cadastrar'" class="flex flex-column gap-3 mb-5">
                    <label for="senha" class="font-semibold w-6rem">Senha</label>
                    <p-password class="f-passwword" formControlName="senha" [toggleMask]="true" [feedback]="false" />
                </div>
            </div>


            <div class="flex justify-content-end gap-2">
                <p-button label="Cancel" severity="secondary" (onClick)="fechar()"/>
                <p-button label="Save" (onClick)="onSubmit()" />
            </div>
        </form>
    </p-dialog>
</div>
