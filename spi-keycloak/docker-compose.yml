services:
  postgres:
    image: postgres:16-alpine
    container_name: feak-keycloak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
      POSTGRES_DB: dbkeycloak
    ports:
      - "5432:5432"
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql/data
    networks:
      - keycloak-net

  keycloak:
    build:
      context: .
      dockerfile: DockerFile
    container_name: feak-keycloak
    command: ["start-dev"]
    restart: unless-stopped
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/dbkeycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_LOGIN_THEME: feak
    ports:
      - "8080:8080"
    volumes:
      - "./themes:/opt/keycloak/themes:ro"
    depends_on:
      - postgres
    networks:
      - keycloak-net

volumes:
  keycloak-postgres-data:

networks:
  keycloak-net:
    driver: bridge
