version: '3.8'

services:
  postgres:
    image: postgres:latest
    container_name: postgres-teste
    restart: always
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
      POSTGRES_DB: dbkeycloak
    ports:
      - "5432:5432"
    networks:
      - keycloak-net

  keycloak:
    build: .
    container_name: keycloak-teste
    command: ["start-dev"]
    restart: always
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/dbkeycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_LOGIN_THEME: pemais-dev
    ports:
      - "8080:8080"
    volumes:
      - "./themes:/opt/keycloak/themes"
    depends_on:
      - postgres
    networks:
      - keycloak-net

networks:
  keycloak-net:
    driver: bridge
